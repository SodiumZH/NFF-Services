modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}"
license="LGPL-3.0"
issueTrackerURL="https://github.com/SodiumZH/nff-services"

[[mods]] #mandatory
modId="${nff_mod_id}" #mandatory
version="${nff_version}"
displayName="${nff_name}" #mandatory
displayURL="https://www.curseforge.com/minecraft/mc-mods/nff-services" 
#logoFile="examplemod.png" #optional
#credits="SodiumZH" #optional
authors="${nff_authors}" #optional
description="${nff_description}"

[[dependencies.${nff_mod_id}]] #optional
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"
    
[[dependencies.${nff_mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${nff_mod_id}]]
    modId="nfulib"
    mandatory=true
    versionRange="${nfu_version_range}"
    ordering="NONE"
    side="BOTH"
